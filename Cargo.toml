[package]
name = "marchiver"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Portable CLI for quality-conscious media archiving and migration"
repository = "https://github.com/caniko/marchiver"
readme = "README.md"
keywords = ["media", "archiving", "video", "av1", "ffmpeg"]
categories = ["command-line-utilities", "multimedia::video"]
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/CHANGELOG.md",
  "/LICENSE-APACHE",
  "/LICENSE-MIT",
  "/pkl/**",
  "/README.md",
  "/src/**",
  "/tests/**",
]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
pklx = { version = "=0.1.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt"] }

[package.metadata.simit.flake]
scope = "full"

[package.metadata.simit.ci]
platform = "github"
runtime = "nix"
with_nextest = true
with_msrv = true
with_audit = true
with_deny = true
publish_crates = true
nix_builds = [".#default"]

[package.metadata.simit.ci.nix_system_runners]
"x86_64-linux" = "ubuntu-24.04"

[package.metadata.simit.prebuild]
publish_attic = true

[package.metadata.simit.release.github]
repo = "caniko/marchiver"
target_branch = "trunk"

[package.metadata.simit.release.artifacts]
runner = "ubuntu-24.04"
build_commands = [
  "mkdir -p release target",
  "nix develop -c cargo build --release --locked --target x86_64-unknown-linux-musl",
  "ldd target/x86_64-unknown-linux-musl/release/marchiver | grep -q 'statically linked'",
  "target/x86_64-unknown-linux-musl/release/marchiver --version | grep -qx \"${VERSION}\"",
  "tar -C target/x86_64-unknown-linux-musl/release -czf \"release/marchiver-${VERSION}-x86_64-linux.tar.gz\" marchiver",
]
checksum_globs = ["*.tar.gz"]
sign = false
substituters = ["https://attic.candee.baby/canix", "https://cache.nixos.org"]
trusted_public_keys = [
  "canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8=",
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
]

[package.metadata.simit.release.attic]
cache = "canix"
url = "https://attic.candee.baby"
token_name = "canix"
token_secret = "ATTIC_TOKEN"
