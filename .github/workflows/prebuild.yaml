# Generated by simit. Manual edits will be reported as ci=drift.
# Required repository secret:
# - ATTIC_TOKEN: Attic token for trusted push and release publication.
name: Native Nix prebuild

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      release:
        required: false
        type: boolean
        default: false
    secrets:
      attic_token:
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-prebuild
  cancel-in-progress: ${{ !inputs.release && (github.event_name == 'push' || github.event_name == 'pull_request') }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://attic.candee.baby/canix https://cache.nixos.org
            trusted-public-keys = canix:lPzPzKrmYqW5Rxa5r0uQWvCqD3S5nx0h2eCy7XD5JM8= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

      - name: Verify runner system
        run: test "$(nix eval --impure --raw --expr builtins.currentSystem)" = "${{ matrix.system }}"
      - name: Build native Nix outputs
        run: |
          set -euo pipefail
          mkdir -p .simit-prebuild
          nix build '.#default' --out-link '.simit-prebuild/ci-0'
      - name: Publish recursive closure to Attic
        if: ${{ github.event_name == 'push' || (inputs.release && github.event_name != 'pull_request') }}
        env:
          ATTIC_TOKEN: ${{ inputs.release && secrets.attic_token || secrets.ATTIC_TOKEN }}
          XDG_CONFIG_HOME: ${{ runner.temp }}/simit-attic-${{ github.run_id }}-${{ github.job }}-${{ matrix.system }}
        run: |
          set -euo pipefail
          if [[ -z "${ATTIC_TOKEN//[[:space:]]/}" || "$ATTIC_TOKEN" == *[!A-Za-z0-9._-]* ]]; then
            echo "ATTIC_TOKEN must be a nonempty Attic JWT" >&2
            exit 1
          fi
          umask 077
          rm -rf "$XDG_CONFIG_HOME"
          install -d -m 0700 "$XDG_CONFIG_HOME/attic"
          attic_config="$XDG_CONFIG_HOME/attic/config.toml"
          install -m 0600 /dev/null "$attic_config"
          {
            printf '%s\n' 'default-server = "canix"'
            printf '%s\n' '[servers.canix]'
            printf '%s\n' 'endpoint = "https://attic.candee.baby"'
            printf 'token = "%s"\n' "$ATTIC_TOKEN"
          } > "$attic_config"
          test "$(stat -c '%a' "$attic_config")" = 600
          shopt -s nullglob
          links=(.simit-prebuild/ci-* .simit-prebuild/release-*)
          if [ "${#links[@]}" -eq 0 ]; then echo "no generated out-links to publish"; exit 0; fi
          nix path-info -r "${links[@]}" > attic-paths.txt
          test -s attic-paths.txt
          attic="$(nix build --inputs-from . --no-link --print-out-paths nixpkgs#attic-client)"
          test -x "$attic/bin/attic"
          "$attic/bin/attic" push --stdin --no-closure --ignore-upstream-cache-filter canix < attic-paths.txt
      - name: Remove ephemeral Attic credentials
        if: ${{ always() }}
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/simit-attic-${{ github.run_id }}-${{ github.job }}-${{ matrix.system }}
        run: rm -rf "$XDG_CONFIG_HOME"
